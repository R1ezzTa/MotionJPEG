<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 960" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <defs>
    <marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1F4E79"/></marker>
    <marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#6C3483"/></marker>
  </defs>
  <rect width="1900" height="960" fill="#FAFCFF"/>
  <text x="950" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F4E79">压缩核数据传输流水链路 · 模块名标注版（全链 100 MHz 单时钟域）</text>

  <!-- 发动机 -->
  <rect x="40" y="300" width="170" height="130" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2.5"/>
  <text x="125" y="325" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1F4E79">mjpeg_board_test_engine</text>
  <text x="125" y="343" text-anchor="middle" font-size="7.5" fill="#888">rtl/top/davinci_mjpeg_board_test_top.v</text>
  <text x="125" y="362" text-anchor="middle" font-size="9">命令 / 配置 / 测量</text>
  <text x="125" y="378" text-anchor="middle" font-size="9">1 像素/拍喂入</text>
  <text x="125" y="394" text-anchor="middle" font-size="9">5 字节记录串行化</text>

  <!-- 嵌套容器 -->
  <rect x="280" y="90" width="1580" height="800" rx="10" fill="#F5F9FF" stroke="#5B87B5" stroke-dasharray="7,4"/>
  <text x="296" y="114" font-size="12.5" font-weight="bold" fill="#3B6EA5">mjpeg_synth_top（rtl/video/mjpeg_synth_top.v，COALESCE=1）</text>
  <rect x="310" y="140" width="1520" height="560" rx="10" fill="#FBFDFF" stroke="#8FAFCB" stroke-dasharray="5,3"/>
  <text x="326" y="164" font-size="12" font-weight="bold" fill="#3B6EA5">mjpeg_encoder（rtl/video/mjpeg_encoder.v，CHANNELS=1）</text>
  <rect x="340" y="190" width="1460" height="460" rx="10" fill="#FDFEFF" stroke="#A9C4D8" stroke-dasharray="4,3"/>
  <text x="356" y="214" font-size="11.5" font-weight="bold" fill="#3B6EA5">mjpeg_channel（rtl/video/mjpeg_channel.v）帧号·时间戳·描述符·abort 自愈</text>
  <rect x="370" y="245" width="1400" height="360" rx="10" fill="#F2FBF5" stroke="#1E8449" stroke-width="2"/>
  <text x="386" y="271" font-size="12.5" font-weight="bold" fill="#1E8449">jpeg_encoder（rtl/core/jpeg_encoder.v）★ 压缩核 · 八级流水</text>

  <!-- 八级流水站 -->
  <rect x="385" y="300" width="155" height="105" rx="7" fill="#FFFFFF" stroke="#1E8449" stroke-width="2"/>
  <text x="462" y="322" text-anchor="middle" font-size="9.5" font-weight="bold">①raster_to_mcu422</text>
  <text x="462" y="337" text-anchor="middle" font-size="7.5" fill="#888">core/frontend/</text>
  <text x="462" y="356" text-anchor="middle" font-size="8.5">像素→MCU 块流</text>
  <text x="462" y="371" text-anchor="middle" font-size="8" fill="#666">2样本/拍·8行乒乓</text>

  <rect x="555" y="300" width="155" height="105" rx="7" fill="#FFFFFF" stroke="#1E8449" stroke-width="2"/>
  <text x="632" y="322" text-anchor="middle" font-size="9.5" font-weight="bold">②dct8x8</text>
  <text x="632" y="337" text-anchor="middle" font-size="7.5" fill="#888">core/dct/（含 dct1d×1）</text>
  <text x="632" y="356" text-anchor="middle" font-size="8.5">行/列两遍 2D DCT</text>
  <text x="632" y="371" text-anchor="middle" font-size="8" fill="#666">27 拍/块·减 128</text>

  <rect x="725" y="300" width="155" height="105" rx="7" fill="#FFFFFF" stroke="#1E8449" stroke-width="2"/>
  <text x="802" y="322" text-anchor="middle" font-size="9.5" font-weight="bold">③quantize</text>
  <text x="802" y="337" text-anchor="middle" font-size="7.5" fill="#888">core/quant/</text>
  <text x="802" y="356" text-anchor="middle" font-size="8.5">量化（乘倒数+校正）</text>
  <text x="802" y="371" text-anchor="middle" font-size="8" fill="#666">无除法器·6 级流水</text>

  <rect x="895" y="300" width="155" height="105" rx="7" fill="#FFFFFF" stroke="#1E8449" stroke-width="2"/>
  <text x="972" y="322" text-anchor="middle" font-size="9.5" font-weight="bold">④zigzag_buffer</text>
  <text x="972" y="337" text-anchor="middle" font-size="7.5" fill="#888">core/entropy/</text>
  <text x="972" y="356" text-anchor="middle" font-size="8.5">对角序重排</text>
  <text x="972" y="371" text-anchor="middle" font-size="8" fill="#666">读地址查表·双 bank</text>

  <rect x="1065" y="300" width="155" height="105" rx="7" fill="#FFFFFF" stroke="#1E8449" stroke-width="2"/>
  <text x="1142" y="322" text-anchor="middle" font-size="9.5" font-weight="bold">⑤symbol_encoder</text>
  <text x="1142" y="337" text-anchor="middle" font-size="7.5" fill="#888">core/entropy/</text>
  <text x="1142" y="356" text-anchor="middle" font-size="8.5">DC 差分+AC 游程</text>
  <text x="1142" y="371" text-anchor="middle" font-size="8" fill="#666">≤5 符号/拍·EOB</text>

  <rect x="1235" y="300" width="155" height="105" rx="7" fill="#FFFFFF" stroke="#1E8449" stroke-width="2"/>
  <text x="1312" y="322" text-anchor="middle" font-size="9.5" font-weight="bold">⑥huffman_encoder</text>
  <text x="1312" y="337" text-anchor="middle" font-size="7.5" fill="#888">core/entropy/</text>
  <text x="1312" y="356" text-anchor="middle" font-size="8.5">四表并行查码</text>
  <text x="1312" y="371" text-anchor="middle" font-size="8" fill="#666">平衡拼接树≤128b</text>

  <rect x="1405" y="300" width="155" height="105" rx="7" fill="#FFFFFF" stroke="#1E8449" stroke-width="2"/>
  <text x="1482" y="322" text-anchor="middle" font-size="9.5" font-weight="bold">⑦entropy_packer</text>
  <text x="1482" y="337" text-anchor="middle" font-size="7.5" fill="#888">core/entropy/</text>
  <text x="1482" y="356" text-anchor="middle" font-size="8.5">比特→字节</text>
  <text x="1482" y="371" text-anchor="middle" font-size="8" fill="#666">FF→FF00 填充</text>

  <rect x="1575" y="300" width="155" height="105" rx="7" fill="#FFFFFF" stroke="#1E8449" stroke-width="2"/>
  <text x="1652" y="322" text-anchor="middle" font-size="9.5" font-weight="bold">⑧jpeg_formatter</text>
  <text x="1652" y="337" text-anchor="middle" font-size="7.5" fill="#888">core/format/</text>
  <text x="1652" y="356" text-anchor="middle" font-size="8.5">头部 ROM+DQT 活读</text>
  <text x="1652" y="371" text-anchor="middle" font-size="8" fill="#666">SOS 直通·EOI 收尾</text>

  <!-- 站间箭头与位宽 -->
  <line x1="540" y1="352" x2="553" y2="352" stroke="#1F4E79" stroke-width="2.2" marker-end="url(#aB)"/>
  <text x="547" y="344" text-anchor="middle" font-size="8" fill="#1F4E79">16b 采样对</text>
  <line x1="710" y1="352" x2="723" y2="352" stroke="#1F4E79" stroke-width="2.2" marker-end="url(#aB)"/>
  <text x="717" y="344" text-anchor="middle" font-size="8" fill="#1F4E79">32b 系数对</text>
  <line x1="880" y1="352" x2="893" y2="352" stroke="#1F4E79" stroke-width="2.2" marker-end="url(#aB)"/>
  <text x="887" y="344" text-anchor="middle" font-size="8" fill="#1F4E79">32b 量化对</text>
  <line x1="1050" y1="352" x2="1063" y2="352" stroke="#1F4E79" stroke-width="2.2" marker-end="url(#aB)"/>
  <text x="1057" y="344" text-anchor="middle" font-size="8" fill="#1F4E79">32b 重排对</text>
  <line x1="1220" y1="352" x2="1233" y2="352" stroke="#1F4E79" stroke-width="2.2" marker-end="url(#aB)"/>
  <text x="1227" y="344" text-anchor="middle" font-size="8" fill="#1F4E79">125b 符号组</text>
  <line x1="1390" y1="352" x2="1403" y2="352" stroke="#1F4E79" stroke-width="2.2" marker-end="url(#aB)"/>
  <text x="1397" y="344" text-anchor="middle" font-size="8" fill="#1F4E79">137b 码流段</text>
  <line x1="1560" y1="352" x2="1573" y2="352" stroke="#1F4E79" stroke-width="2.2" marker-end="url(#aB)"/>
  <text x="1567" y="344" text-anchor="middle" font-size="8" fill="#1F4E79">134b 字节拍</text>

  <!-- 三个弹性缓冲 -->
  <rect x="1149" y="480" width="155" height="50" rx="7" fill="#F2F2F2" stroke="#666" stroke-dasharray="5,3"/>
  <text x="1226" y="500" text-anchor="middle" font-size="9" font-weight="bold">jpeg_stream_buffer</text>
  <text x="1226" y="516" text-anchor="middle" font-size="8.5" fill="#555">WIDTH=125 · 两深</text>
  <line x1="1227" y1="358" x2="1227" y2="478" stroke="#666" stroke-width="1.4" stroke-dasharray="4,3"/>
  <rect x="1319" y="480" width="155" height="50" rx="7" fill="#F2F2F2" stroke="#666" stroke-dasharray="5,3"/>
  <text x="1396" y="500" text-anchor="middle" font-size="9" font-weight="bold">jpeg_stream_buffer</text>
  <text x="1396" y="516" text-anchor="middle" font-size="8.5" fill="#555">WIDTH=137 · 两深</text>
  <line x1="1397" y1="358" x2="1397" y2="478" stroke="#666" stroke-width="1.4" stroke-dasharray="4,3"/>
  <rect x="1489" y="480" width="155" height="50" rx="7" fill="#F2F2F2" stroke="#666" stroke-dasharray="5,3"/>
  <text x="1566" y="500" text-anchor="middle" font-size="9" font-weight="bold">jpeg_stream_buffer</text>
  <text x="1566" y="516" text-anchor="middle" font-size="8.5" fill="#555">WIDTH=134 · 两深</text>
  <line x1="1567" y1="358" x2="1567" y2="478" stroke="#666" stroke-width="1.4" stroke-dasharray="4,3"/>

  <text x="1070" y="575" text-anchor="middle" font-size="10.5" fill="#1E8449">随行元数据 component[1:0]+pair[4:0]+frame_start/end 与数据同拍穿透全链 · 每站 ≥1 对/拍 · 背压逐站回传</text>

  <!-- mjpeg_encoder 内部输出缓冲与仲裁 -->
  <rect x="1180" y="618" width="280" height="55" rx="7" fill="#F2F2F2" stroke="#666" stroke-dasharray="5,3"/>
  <text x="1320" y="640" text-anchor="middle" font-size="9.5" font-weight="bold">jpeg_stream_buffer</text>
  <text x="1320" y="658" text-anchor="middle" font-size="8.5" fill="#555">WIDTH=167 · 通道输出缓冲（common/）</text>
  <polyline points="1652,405 1652,618 1462,618" fill="none" stroke="#1F4E79" stroke-width="2.2" marker-end="url(#aB)"/>
  <text x="1660" y="510" transform="rotate(-90 1660 510)" text-anchor="middle" font-size="8.5" fill="#1F4E79">128b JPEG 拍 + m_last(EOI)</text>

  <rect x="860" y="618" width="280" height="55" rx="7" fill="#FFFFFF" stroke="#3B6EA5" stroke-width="2"/>
  <text x="1000" y="640" text-anchor="middle" font-size="9.5" font-weight="bold">mjpeg_arbiter ×2（video/）</text>
  <text x="1000" y="658" text-anchor="middle" font-size="8.5" fill="#555">载荷 / 描述符轮询合流</text>
  <line x1="1178" y1="645" x2="1142" y2="645" stroke="#1F4E79" stroke-width="2.2" marker-end="url(#aB)"/>
  <text x="1160" y="636" text-anchor="middle" font-size="8" fill="#1F4E79">167b</text>
  <polyline points="1000,673 1000,712 480,712 480,728" fill="none" stroke="#1F4E79" stroke-width="2.2" marker-end="url(#aB)"/>

  <!-- synth_top 内聚合与封包 -->
  <rect x="340" y="730" width="280" height="55" rx="7" fill="#FFFFFF" stroke="#6C3483" stroke-width="2"/>
  <text x="480" y="752" text-anchor="middle" font-size="9.5" font-weight="bold">mjpeg_payload_coalescer</text>
  <text x="480" y="770" text-anchor="middle" font-size="8.5" fill="#555">video/ · 攒 16 字节满拍（膨胀 10.2×→1.01×）</text>
  <rect x="660" y="730" width="280" height="55" rx="7" fill="#FFFFFF" stroke="#6C3483" stroke-width="2"/>
  <text x="800" y="752" text-anchor="middle" font-size="9.5" font-weight="bold">mjpeg_packetizer</text>
  <text x="800" y="770" text-anchor="middle" font-size="8.5" fill="#555">video/ · 32 位传输封包</text>
  <line x1="620" y1="757" x2="658" y2="757" stroke="#6C3483" stroke-width="2.2" marker-end="url(#aP)"/>

  <!-- 入口：发动机 → 流水线 -->
  <line x1="210" y1="330" x2="383" y2="330" stroke="#1F4E79" stroke-width="2.2" marker-end="url(#aB)"/>
  <text x="300" y="321" text-anchor="middle" font-size="8.5" fill="#1F4E79">YUYV 像素 + sof/eol/eof</text>

  <!-- 出口：封包 → 发动机 -->
  <polyline points="800,785 800,815 255,815 255,375 212,375" fill="none" stroke="#6C3483" stroke-width="2.2" marker-end="url(#aP)"/>
  <text x="247" y="600" transform="rotate(-90 247 600)" text-anchor="middle" font-size="9" fill="#6C3483">32 位包 m_data / m_bytes / m_packet_last → 回发动机</text>

  <!-- 图例 -->
  <text x="60" y="925" font-size="11" fill="#444">绿=压缩算法八级（rtl/core/）· 蓝=包装层（rtl/video/，不改 JPEG 字节）· 紫封包/聚合 · 灰虚线框=两深弹性缓冲 jpeg_stream_buffer · 深蓝箭头上的数字=该跳数据位宽</text>
  <text x="60" y="948" font-size="11" fill="#444">速率锚定：输入 1 像素/拍 → 链内 1 对/拍 → 1 块/32 拍；1080p 一帧 = 64,800 块 = 2,073,600 拍 = 20.736 ms @100 MHz（上限 48.2 fps）。</text>
</svg>
